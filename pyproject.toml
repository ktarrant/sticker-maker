[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sticker-maker"
version = "0.1.0"
description = "Turn overhead photos of physical media into Cricut-ready sticker cut paths."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sticker Maker Project" }]
dependencies = [
    "gphoto2>=2.6.4",
    "numpy>=2.0",
    "pillow>=11.0",
    "shapely>=2.1,<3",
]

[project.optional-dependencies]
parser = ["opencv-python-headless>=4.11,<5"]
gui = ["opencv-python-headless>=4.11,<5", "PySide6-Essentials>=6.8,<7"]
sam = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[project.scripts]
sticker-maker = "sticker_maker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sticker_maker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

