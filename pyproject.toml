[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sticker-maker"
version = "0.1.0"
description = "Turn overhead photos of physical media into Cricut-ready sticker cut paths."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sticker Maker Project" }]
dependencies = [
    "gphoto2>=2.6.4",
    "pillow>=11.0",
]

[project.scripts]
sticker-maker = "sticker_maker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sticker_maker"]

[tool.uv]
package = true

